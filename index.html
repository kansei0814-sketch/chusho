<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>診断士4択マスター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore-compat.js"></script>
    <style>
        .animate-in {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 font-sans selection:bg-indigo-100">

    <div id="app" class="max-w-md mx-auto px-4 py-8">
        <!-- Header -->
        <header class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-lg shadow-indigo-200">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5a2.5 2.5 0 0 0-4.96-.46 2.5 2.5 0 0 0-1.98 3 2.5 2.5 0 0 0 .98 4.96 2.5 2.5 0 0 0 0 5.04 2.5 2.5 0 0 0-1 4.96 2.5 2.5 0 0 0 3 1.98 2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 4.96.46 2.5 2.5 0 0 0 3-1.98 2.5 2.5 0 0 0-1-4.96 2.5 2.5 0 0 0 0-5.04 2.5 2.5 0 0 0 1-4.96 2.5 2.5 0 0 0-3-1.98 2.5 2.5 0 0 0-4.96.46Z"/><path d="M12 10.5V12"/><path d="M12 15.5V16"/></svg>
                </div>
                <h1 class="text-xl font-bold text-slate-800">診断士4択マスター</h1>
            </div>
            <div id="user-badge" class="hidden text-[10px] font-bold text-slate-400 bg-white border border-slate-200 px-3 py-1 rounded-full uppercase">ID: ----</div>
        </header>

        <!-- Menu Screen -->
        <div id="screen-menu" class="space-y-6">
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <div id="stat-total" class="text-3xl font-black text-indigo-600">0</div>
                    <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">解答数</div>
                </div>
                <div class="h-10 w-px bg-slate-100"></div>
                <div class="text-right">
                    <div id="stat-accuracy" class="text-3xl font-black text-emerald-500">0%</div>
                    <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">正答率</div>
                </div>
            </div>

            <div class="space-y-3">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">カテゴリー選択</p>
                <div id="category-list" class="space-y-2">
                    <!-- Categories will be injected here -->
                </div>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="screen-quiz" class="hidden space-y-6 animate-in">
            <div class="flex items-center justify-between text-xs font-bold text-slate-400">
                <span id="quiz-category-name">カテゴリー</span>
                <span id="quiz-progress">1 / 10</span>
            </div>

            <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100 text-center min-h-[160px] flex flex-col justify-center">
                <span class="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-4">Question</span>
                <p id="question-text" class="text-lg font-bold text-slate-800 leading-snug">問題文がここに表示されます</p>
            </div>

            <div id="choices-container" class="grid grid-cols-1 gap-3">
                <!-- Choices will be injected here -->
            </div>

            <button id="btn-next" class="hidden w-full py-5 bg-indigo-600 text-white rounded-2xl font-black text-sm uppercase tracking-widest shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all active:scale-[0.98]">
                次へ進む
            </button>
        </div>

        <!-- Result Screen -->
        <div id="screen-result" class="hidden text-center space-y-8 py-4 animate-in">
            <div class="bg-white rounded-3xl p-10 border border-slate-100 shadow-sm">
                <div class="flex justify-center mb-6 text-amber-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                </div>
                <h2 class="text-2xl font-black text-slate-800 mb-2">セッション終了！</h2>
                <p class="text-sm text-slate-400 font-medium">お疲れ様でした。</p>
                <div class="mt-8 flex justify-center items-baseline gap-2">
                    <span id="session-score" class="text-5xl font-black text-indigo-600">0</span>
                    <span class="text-xl font-bold text-slate-300">/ 10</span>
                </div>
            </div>
            <button onclick="showMenu()" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black hover:bg-indigo-700 transition shadow-lg shadow-indigo-100">
                メニューに戻る
            </button>
        </div>
    </div>

    <script>
        // --- Data ---
        const QUIZ_MASTER = {
            econ: [
                { q: "価格が上昇すると需要が減り、価格が下落すると需要が増える関係。", a: "需要の法則" },
                { q: "消費が1単位増えたとき、総効用がどれだけ増加するかを示す概念。", a: "限界効用" },
                { q: "一国の経済活動の規模を測る指標。国内で生み出された付加価値の合計。", a: "GDP (国内総生産)" },
                { q: "物価上昇が続く状態。通貨価値が下落する。", a: "インフレーション" },
                { q: "景気後退局面で、政府支出を増やしたり減税を行ったりする政策。", a: "フィスカル・ポリシー" },
                { q: "中央銀行が買いオペ・売りオペなどを通じてマネタリーベースを調節する政策。", a: "公開市場操作" },
                { q: "IS曲線とLM曲線を用いて、財市場と貨幣市場の同時均衡を分析するモデル。", a: "IS-LM分析" }
            ],
            fin: [
                { q: "一定時点における企業の資産、負債、純資産の状態を示す計算書。", a: "貸借対照表 (B/S)" },
                { q: "一定期間における企業の経営成績を示す計算書。", a: "損益計算書 (P/L)" },
                { q: "株主資本に対する当期純利益の割合。", a: "ROE (自己資本利益率)" },
                { q: "利益がゼロとなる売上高のポイント。", a: "損益分岐点" },
                { q: "将来受け取る現金を、現在の価値に割り引いた計算手法。", a: "DCF法" },
                { q: "売上高から売上原価を差し引いた利益。", a: "売上総利益" }
            ],
            theory: [
                { q: "自社の「強み」「弱み」と、外部環境の「機会」「脅威」を整理する分析手法。", a: "SWOT分析" },
                { q: "市場の成長率と相対的シェアから、事業の立ち位置を判断する手法。", a: "PPM" },
                { q: "製品、価格、流通、プロモーションの組み合わせ。", a: "マーケティング・ミックス (4P)" },
                { q: "原材料の調達から最終消費者に届くまでの付加価値の流れ。", a: "バリューチェーン" },
                { q: "組織の目的達成のために、構成員の行動を方向づけるプロセス。", a: "リーダーシップ" }
            ],
            ops: [
                { q: "必要なものを、必要な時に、必要な量だけ生産・運搬する方式。", a: "ジャストインタイム (JIT)" },
                { q: "小売業において、売上高の貢献度に応じて在庫をランク付けする分析法。", a: "ABC分析" },
                { q: "作業ミスを物理的に防ぐ仕組み。", a: "ポカヨケ" },
                { q: "多品種少量生産において、生産設備をグループごとに配置する方式。", a: "セル生産方式" }
            ],
            legal: [
                { q: "発明について、独占的に利用できる権利を認める制度。", a: "特許権" },
                { q: "営利を目的として設立された社団法人。", a: "株式会社" },
                { q: "取締役が会社に対して負う、善良な管理者の注意をもって職務を遂行する義務。", a: "善管注意義務" }
            ],
            it: [
                { q: "インターネットを通じて、サーバーやソフトなどを利用する形態。", a: "クラウドコンピューティング" },
                { q: "企業内の基幹業務を統合的に管理するシステム。", a: "ERP" },
                { q: "インターネット上のあらゆるものが、通信機能を持ってつながること。", a: "IoT" }
            ],
            policy: [
                { q: "中小企業政策の基本理念を定めた法律。", a: "中小企業基本法" },
                { q: "製造業における中小企業の定義で、資本金は何億円以下か。", a: "3億円以下" },
                { q: "中小企業の資金繰りを支援するために、融資の保証を行う公的機関。", a: "信用保証協会" }
            ]
        };

        const CATEGORIES = [
            { id: 'all', name: '全科目ミックス', color: 'bg-slate-800' },
            { id: 'econ', name: '経済学・経済政策', color: 'bg-blue-600' },
            { id: 'fin', name: '財務・会計', color: 'bg-emerald-600' },
            { id: 'theory', name: '企業経営理論', color: 'bg-orange-600' },
            { id: 'ops', name: '運営管理', color: 'bg-purple-600' },
            { id: 'legal', name: '経営法務', color: 'bg-red-600' },
            { id: 'it', name: '経営情報システム', color: 'bg-cyan-600' },
            { id: 'policy', name: '中小企業経営・政策', color: 'bg-amber-600' }
        ];

        // --- Firebase Logic ---
        const firebaseConfig = JSON.parse(__firebase_config);
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'shindanshi-html-quiz';

        let currentUser = null;
        let stats = { totalAnswered: 0, correctAnswers: 0 };
        let currentQuizData = [];
        let currentIndex = 0;
        let sessionScore = 0;
        let isAnswered = false;

        async function initAuth() {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await auth.signInWithCustomToken(__initial_auth_token);
            } else {
                await auth.signInAnonymously();
            }
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUser = user;
                    document.getElementById('user-badge').textContent = `ID: ${user.uid.slice(0, 5)}`;
                    document.getElementById('user-badge').classList.remove('hidden');
                    syncStats();
                }
            });
        }

        function syncStats() {
            if (!currentUser) return;
            const statsRef = db.collection('artifacts').doc(appId).collection('users').doc(currentUser.uid).collection('learning').doc('stats');
            statsRef.onSnapshot(doc => {
                if (doc.exists) {
                    stats = doc.data();
                    updateStatsUI();
                }
            }, err => console.error("Stats sync error", err));
        }

        function updateStatsUI() {
            document.getElementById('stat-total').textContent = stats.totalAnswered;
            const acc = stats.totalAnswered > 0 ? Math.round((stats.correctAnswers / stats.totalAnswered) * 100) : 0;
            document.getElementById('stat-accuracy').textContent = `${acc}%`;
        }

        // --- UI Logic ---
        function renderCategories() {
            const container = document.getElementById('category-list');
            container.innerHTML = '';
            CATEGORIES.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = "w-full group bg-white p-4 rounded-2xl border border-slate-200 flex items-center justify-between hover:border-indigo-500 hover:shadow-md transition-all active:scale-[0.98]";
                btn.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-2 h-2 rounded-full ${cat.color}"></div>
                        <span class="font-bold text-slate-700">${cat.name}</span>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-300 group-hover:text-indigo-500 transition-colors"><path d="m9 18 6-6-6-6"/></svg>
                `;
                btn.onclick = () => startQuiz(cat.id);
                container.appendChild(btn);
            });
        }

        function startQuiz(catId) {
            let pool = [];
            if (catId === 'all') {
                Object.values(QUIZ_MASTER).forEach(list => pool.push(...list));
            } else {
                pool = QUIZ_MASTER[catId] || [];
            }

            // Shuffle and pick 10
            const selected = [...pool].sort(() => 0.5 - Math.random()).slice(0, 10);
            
            // Generate Choices
            const allAnswers = [];
            Object.values(QUIZ_MASTER).forEach(list => list.forEach(item => allAnswers.push(item.a)));
            
            currentQuizData = selected.map(item => {
                const distractors = [...new Set(allAnswers.filter(a => a !== item.a))]
                    .sort(() => 0.5 - Math.random())
                    .slice(0, 3);
                const choices = [item.a, ...distractors].sort(() => 0.5 - Math.random());
                return { ...item, choices };
            });

            currentIndex = 0;
            sessionScore = 0;
            showScreen('quiz');
            renderQuestion();
            
            const catObj = CATEGORIES.find(c => c.id === catId);
            document.getElementById('quiz-category-name').textContent = catObj.name;
        }

        function renderQuestion() {
            isAnswered = false;
            const item = currentQuizData[currentIndex];
            document.getElementById('quiz-progress').textContent = `${currentIndex + 1} / 10`;
            document.getElementById('question-text').textContent = item.q;
            document.getElementById('btn-next').classList.add('hidden');

            const container = document.getElementById('choices-container');
            container.innerHTML = '';
            
            item.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "p-4 rounded-2xl border-2 border-slate-200 font-bold text-sm text-left bg-white hover:bg-slate-50 transition-all flex justify-between items-center";
                btn.textContent = choice;
                btn.onclick = () => handleSelect(choice, btn);
                container.appendChild(btn);
            });
        }

        async function handleSelect(choice, btn) {
            if (isAnswered) return;
            isAnswered = true;
            
            const correct = currentQuizData[currentIndex].a;
            const isCorrect = (choice === correct);
            
            if (isCorrect) {
                sessionScore++;
                btn.classList.replace('border-slate-200', 'bg-emerald-500');
                btn.classList.replace('bg-white', 'border-emerald-500');
                btn.classList.add('text-white');
            } else {
                btn.classList.replace('border-slate-200', 'bg-red-500');
                btn.classList.replace('bg-white', 'border-red-500');
                btn.classList.add('text-white');
                
                // Show correct one
                Array.from(document.getElementById('choices-container').children).forEach(b => {
                    if (b.textContent === correct) {
                        b.classList.replace('border-slate-200', 'bg-emerald-500');
                        b.classList.replace('bg-white', 'border-emerald-500');
                        b.classList.add('text-white');
                    } else if (b !== btn) {
                        b.classList.add('opacity-40');
                    }
                });
            }

            // Update stats
            if (currentUser) {
                const statsRef = db.collection('artifacts').doc(appId).collection('users').doc(currentUser.uid).collection('learning').doc('stats');
                await statsRef.set({
                    totalAnswered: stats.totalAnswered + 1,
                    correctAnswers: stats.correctAnswers + (isCorrect ? 1 : 0)
                }, { merge: true });
            }

            document.getElementById('btn-next').classList.remove('hidden');
            document.getElementById('btn-next').textContent = currentIndex === 9 ? "結果を見る" : "次の問題へ";
            document.getElementById('btn-next').onclick = () => {
                if (currentIndex < 9) {
                    currentIndex++;
                    renderQuestion();
                } else {
                    showResults();
                }
            };
        }

        function showResults() {
            showScreen('result');
            document.getElementById('session-score').textContent = sessionScore;
        }

        function showScreen(id) {
            ['menu', 'quiz', 'result'].forEach(s => {
                document.getElementById(`screen-${s}`).classList.add('hidden');
            });
            document.getElementById(`screen-${id}`).classList.remove('hidden');
        }

        function showMenu() {
            showScreen('menu');
        }

        // --- Init ---
        window.onload = () => {
            initAuth();
            renderCategories();
        };
    </script>
</body>
</html>
