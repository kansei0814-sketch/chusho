<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中小企業診断士 一問一答マスター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .card-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .is-flipped { transform: rotateY(180deg); }
        .card-front, .card-back {
            backface-visibility: hidden;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        .card-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="app" class="max-w-md mx-auto px-4 py-8">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-2xl font-bold text-indigo-700">診断士一問一答</h1>
            <p class="text-sm text-slate-500">Exam Preparation Quiz</p>
        </header>

        <!-- Category Selection -->
        <div id="category-screen" class="space-y-4">
            <h2 class="text-lg font-semibold text-slate-700 mb-4">科目を選択してください</h2>
            <div id="category-list" class="grid gap-3">
                <!-- Categories will be injected here -->
            </div>
        </div>

        <!-- Quiz Screen (Hidden by default) -->
        <div id="quiz-screen" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <button onclick="showCategories()" class="text-indigo-600 font-medium">← 戻る</button>
                <div class="text-sm font-semibold bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full">
                    <span id="current-index">1</span> / <span id="total-questions">0</span>
                </div>
            </div>

            <div class="relative h-64 w-full mb-8 cursor-pointer" onclick="flipCard()">
                <div id="flashcard" class="card-inner w-full h-full relative">
                    <!-- Front -->
                    <div class="card-front bg-white border-2 border-indigo-200 rounded-2xl shadow-sm flex flex-col p-6 items-center justify-center text-center">
                        <span class="text-xs font-bold text-indigo-400 mb-2 uppercase tracking-widest">Description / Definition</span>
                        <p id="question-text" class="text-lg text-slate-800 leading-relaxed font-medium"></p>
                        <p class="text-xs text-slate-400 mt-4 italic">タップして正解を表示</p>
                    </div>
                    <!-- Back -->
                    <div class="card-back bg-indigo-600 border-2 border-indigo-500 rounded-2xl shadow-lg flex flex-col p-6 items-center justify-center text-center text-white">
                        <span class="text-xs font-bold opacity-70 mb-2 uppercase tracking-widest">Answer / Term</span>
                        <p id="answer-text" class="text-3xl font-bold"></p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="handleResponse(false)" class="py-4 rounded-xl border-2 border-red-100 bg-red-50 text-red-600 font-bold hover:bg-red-100 transition">わからなかった</button>
                <button onclick="handleResponse(true)" class="py-4 rounded-xl border-2 border-green-100 bg-green-50 text-green-600 font-bold hover:bg-green-100 transition">わかった！</button>
            </div>
        </div>

        <!-- Result Screen (Hidden by default) -->
        <div id="result-screen" class="hidden text-center py-10">
            <div class="mb-6">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-indigo-100 text-indigo-600 mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">学習完了！</h2>
                <p class="text-slate-500 mt-2">この科目の全問題を解き終えました。</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
                <div class="text-4xl font-bold text-indigo-600" id="score-text">0/0</div>
                <div class="text-sm text-slate-400 mt-1 font-medium">正解数</div>
            </div>
            <button onclick="showCategories()" class="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 shadow-md transition">他の科目を選ぶ</button>
        </div>
    </div>

    <script>
        // 用語集データ (指定サイトの情報を基にしたサンプルセット)
        const quizData = {
            "企業経営理論": [
                { q: "企業の持続的な競争優位の源泉は、組織内部にある経営資源にあるとする考え方。", a: "リソース・ベースド・ビュー (RBV)" },
                { q: "強み(Strengths)、弱み(Weaknesses)、機会(Opportunities)、脅威(Threats)を分析する手法。", a: "SWOT分析" },
                { q: "製品と市場の2軸から、成長戦略を「市場浸透」「製品開発」「市場開拓」「多角化」に分類する行列。", a: "アンゾフの成長行列" },
                { q: "業界の競争状態を決定する5つの力（新規参入、代替品、買い手、売り手、既存競合）を分析する枠組み。", a: "ファイブフォース分析" },
                { q: "組織が共有する価値観、信念、慣習などのこと。", a: "組織文化" }
            ],
            "運営管理": [
                { q: "必要なものを、必要な時に、必要な量だけ生産・運搬する生産管理方式。", a: "ジャストインタイム (JIT)" },
                { q: "工程上の仕掛品を最小限にし、生産の流れを管理するための指示票。", a: "かんばん" },
                { q: "多品種少量生産において、段取り替え時間を短縮するために行われる工夫。", a: "シングル段取り" },
                { q: "小売業において、売れ筋商品と死に筋商品を把握するための分析手法。", a: "ABC分析" }
            ],
            "財務・会計": [
                { q: "売上高と費用の額が等しくなり、利益も損失も出ない状態の売上高。", a: "損益分岐点売上高" },
                { q: "自己資本に対する当期純利益の割合を示す、総合的な収益性指標。", a: "ROE (自己資本利益率)" },
                { q: "一定期間の現金の流入（インフロー）と流出（アウトフロー）を記録したもの。", a: "キャッシュフロー計算書" },
                { q: "投資額に対して、将来得られるキャッシュフローの現在価値の合計から投資額を引いた値。", a: "NPV (正味現在価値)" }
            ],
            "経済学・経済政策": [
                { q: "ある財の価格が上昇すると、代替的な財の需要が増え、その財自体の需要が減る効果。", a: "代替効果" },
                { q: "市場メカニズムが働かず、資源配分が効率的に行われない状態。", a: "市場の失敗" },
                { q: "一国の中で一定期間に生産された付加価値の合計。", a: "GDP (国内総生産)" }
            ]
        };

        let currentCategory = "";
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;

        // カテゴリリストの初期化
        function initCategories() {
            const list = document.getElementById('category-list');
            list.innerHTML = '';
            Object.keys(quizData).forEach(cat => {
                const btn = document.createElement('button');
                btn.className = "w-full p-5 bg-white border border-slate-200 rounded-xl text-left hover:border-indigo-500 hover:shadow-md transition group flex justify-between items-center";
                btn.innerHTML = `
                    <span class="font-semibold text-slate-700 group-hover:text-indigo-600">${cat}</span>
                    <span class="text-xs bg-slate-100 text-slate-400 px-2 py-1 rounded">${quizData[cat].length} 問</span>
                `;
                btn.onclick = () => startQuiz(cat);
                list.appendChild(btn);
            });
        }

        function startQuiz(category) {
            currentCategory = category;
            currentQuestions = [...quizData[category]].sort(() => Math.random() - 0.5);
            currentIndex = 0;
            score = 0;
            
            document.getElementById('category-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            updateQuestion();
        }

        function updateQuestion() {
            const q = currentQuestions[currentIndex];
            document.getElementById('current-index').textContent = currentIndex + 1;
            document.getElementById('total-questions').textContent = currentQuestions.length;
            document.getElementById('question-text').textContent = q.q;
            document.getElementById('answer-text').textContent = q.a;
            
            // カードを元に戻す
            document.getElementById('flashcard').classList.remove('is-flipped');
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('is-flipped');
        }

        function handleResponse(isCorrect) {
            if (isCorrect) score++;
            
            if (currentIndex < currentQuestions.length - 1) {
                currentIndex++;
                updateQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-text').textContent = `${score} / ${currentQuestions.length}`;
        }

        function showCategories() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('category-screen').classList.remove('hidden');
        }

        // 初期化実行
        window.onload = initCategories;
    </script>
</body>
</html>
